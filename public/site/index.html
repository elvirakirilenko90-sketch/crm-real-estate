:root{--bg:#0B0B0C;--card:#18181B;--line:#27272A;--line2:#3F3F46;--tx:#F4F4F5;--mut:#A1A1AA;--dim:#71717A;--y:#F5C518;--y2:#FFD84D}

body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;hyphens:manual}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
